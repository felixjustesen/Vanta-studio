<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smilværket – Genskab dit ægte smil</title>
<meta name="description" content="Smilværket er en moderne tandklinik, der bruger avanceret teknologi til skånsomme behandlinger og et sundt, selvsikkert smil.">
<meta name="theme-color" content="#5F9AD1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235F9AD1'/%3E%3Cpath d='M9 11.5c0-2 1.6-3.2 3.3-3.2 1.1 0 2 .5 3.7.5s2.6-.5 3.7-.5c1.7 0 3.3 1.2 3.3 3.2 0 2.8-1.3 4-1.8 6.7-.4 2-.8 4-2 4s-1.4-3.3-3.2-3.3-2 3.3-3.2 3.3-1.6-2-2-4C10.3 15.5 9 14.3 9 11.5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Inter";src:url("assets/fonts/inter.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}

:root{
  --blue:#5F9AD1;
  --blue-deep:#3D8CD5;
  --lime:#EBFA73;
  --white-60:rgba(255,255,255,.6);
  --expo:cubic-bezier(.16,1,.3,1);

  --px:24px;
}
@media (min-width:768px){:root{--px:32px}}
@media (min-width:1024px){:root{--px:64px}}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--blue);color:#fff;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
a{color:inherit;text-decoration:none}
button{margin:0;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
a,button{-webkit-tap-highlight-color:transparent}
img,svg,video{display:block}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* ---------- Hero ---------- */
.hero{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;background:var(--blue)}
.bg{position:absolute;left:0;top:30%;width:100%;height:70%;object-fit:cover;object-position:80% center;animation:fadeIn 1.2s ease-out .2s both}
.blend{position:absolute;left:0;right:0;top:30%;z-index:1;height:128px;background:linear-gradient(var(--blue),rgba(95,154,209,0))}
@media (min-width:768px){
  .bg{inset:0;height:100%;object-position:center}
  .blend{display:none}
}
.content{position:relative;z-index:10;display:flex;flex-direction:column;height:100%}

/* ---------- Header ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px var(--px) 0;animation:slideDown .7s ease-out .1s both}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:500;letter-spacing:-.025em}
.logo svg{width:28px;height:32px}
.nav{display:none;gap:32px;font-size:18px}
.nav a{color:var(--white-60);white-space:nowrap;transition:color .3s}
.nav a:hover,.nav a[aria-current]{color:#fff}
.nav a[aria-current]{font-weight:500}
.contact{display:none;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;background:#fff;color:#000;font-size:18px}
.contact .ring{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--lime);color:var(--blue);transition:transform .3s var(--expo)}
.contact:hover .ring{transform:scale(1.1)}
.contact .ring svg{width:16px;height:16px}

.burger,.close{display:grid;place-items:center;width:44px;height:44px}
.burger{margin-right:-10px}
.burger svg,.close svg{width:26px;height:26px;transition:opacity .3s,transform .3s}
.open .burger svg{opacity:0;transform:rotate(90deg) scale(.6)}
.close{position:absolute;top:14px;right:14px}
.close svg{opacity:0;transform:rotate(-90deg) scale(.6)}
.open .close svg{opacity:1;transform:none}

@media (min-width:768px){
  .hdr{padding-top:32px}
  .logo{font-size:24px}
  .logo svg{width:32px;height:36px}
  .nav,.contact{display:flex}
  .burger{display:none}
}
@media (min-width:1024px){
  .hdr{padding-top:48px}
  .logo{font-size:28px}
}
@media (min-width:1280px){.nav{gap:48px}}

/* ---------- Overskrift ---------- */
.intro{max-width:768px;margin-top:32px;padding:0 var(--px);text-align:center;animation:blurIn .9s ease-out .3s both}
.intro h1{margin:0;font-size:72px;font-weight:400;line-height:.9;letter-spacing:-.025em}
.smile{display:inline-flex;align-items:flex-end;gap:16px}
.faces{display:none;margin-bottom:.1em}
.faces > *{width:40px;height:40px;border-radius:50%;border:2px solid var(--blue)}
.faces > * + *{margin-left:-8px}
.faces img{object-fit:cover}
.faces span{display:grid;place-items:center;border-color:#fff;background:#fff;color:var(--blue-deep);font-size:11px;font-weight:500;letter-spacing:-.02em}
.lead{display:none;max-width:448px;margin:20px 0 0;font-size:18px;line-height:1.25;color:var(--white-60)}
.lead b{font-weight:400;color:#fff}
@media (min-width:640px){.intro h1{font-size:60px}}
@media (min-width:768px){
  .intro{margin-top:24px;text-align:left}
  .intro h1{line-height:.85}
  .faces{display:flex}
  .lead{display:block}
}
@media (min-width:1024px){
  .intro{margin-top:40px}
  .intro h1{font-size:90px}
  .smile{gap:24px}
  .faces > *{width:56px;height:56px}
  .faces span{font-size:14px}
  .lead{margin-top:24px}
}
@media (min-width:1280px){.intro h1{font-size:100px}}

/* ---------- Statistik + figur ---------- */
.figure{position:absolute;bottom:0;left:16px;z-index:10;display:none;width:208px;animation:slideUp .9s ease-out .8s both}
.figure img{position:relative;z-index:10;width:100%;height:auto;object-fit:contain}
.stat{position:absolute;top:32px;left:12px;z-index:20;width:38%;color:var(--blue-deep);text-align:center}
.stat strong{display:block;font-size:24px;font-weight:700;line-height:1.1}
.stat small{display:block;font-size:12px;font-weight:500;line-height:1.2}
@media (min-width:640px){.figure{width:256px}}
@media (min-width:768px){.figure{display:block}}
@media (min-width:1024px){
  .figure{left:48px;width:320px}
  .stat{top:48px;left:16px}
  .stat strong{font-size:36px}
  .stat small{font-size:14px}
}

/* ---------- Mobilmenu ---------- */
.menu{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:96px 24px 48px;background:rgba(95,154,209,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:opacity .5s var(--expo),visibility 0s .5s}
.open .menu{opacity:1;visibility:visible;transition:opacity .5s var(--expo)}
.menu nav{display:grid;gap:14px}
.menu nav a,.menu .contact{opacity:0;transform:translateY(16px);transition:opacity .5s var(--expo),transform .5s var(--expo)}
.menu nav a{font-size:30px;font-weight:300;line-height:1.2}
.menu .contact{display:inline-flex;align-self:flex-start}
.open .menu nav a,.open .menu .contact{opacity:1;transform:none;transition-delay:calc(100ms + var(--i,0) * 60ms)}
.open .menu .contact{transition-delay:400ms}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blurIn{from{opacity:0;filter:blur(12px)}to{opacity:1;filter:blur(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<section class="hero">
  <video class="bg" autoplay muted loop playsinline preload="auto" aria-hidden="true"
    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260710_141802_1d85412a-1df8-4993-8fc4-7400520bb1d1.mp4"></video>
  <div class="blend" aria-hidden="true"></div>

  <div class="content">
    <header class="hdr">
      <a class="logo" href="./" aria-label="Smilværket – til forsiden">
        <svg viewBox="0 0 28 32" aria-hidden="true">
          <path fill="#fff" d="M14 0C6.3 0 0 6.1 0 13.6c0 9.4 11.7 17.4 12.2 17.8a3 3 0 0 0 3.6 0C16.3 31 28 23 28 13.6 28 6.1 21.7 0 14 0z"/>
          <path fill="#5F9AD1" d="M8.6 10.6c0-1.8 1.4-2.8 2.9-2.8 1 0 1.7.4 2.5.4s1.5-.4 2.5-.4c1.5 0 2.9 1 2.9 2.8 0 2.4-1.1 3.5-1.6 5.8-.3 1.7-.7 3.4-1.7 3.4s-1.2-2.8-2.1-2.8-1.1 2.8-2.1 2.8-1.4-1.7-1.7-3.4c-.5-2.3-1.6-3.4-1.6-5.8z"/>
        </svg>
        Smilværket
      </a>

      <nav class="nav" aria-label="Hovednavigation">
        <a href="#om" aria-current="page">Om os</a>
        <a href="#resultater">Resultater</a>
        <a href="#priser">Priser</a>
        <a href="#anmeldelser">Anmeldelser</a>
        <a href="#blog">Blog</a>
      </nav>

      <a class="contact" href="#kontakt">Kontakt
        <span class="ring" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></span>
      </a>

      <button class="burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="Åbn menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </header>

    <div class="intro">
      <h1>Genskab<br>dit ægte<br>
        <span class="smile">smil
          <span class="faces" aria-hidden="true">
            <img src="https://images.pexels.com/photos/1239291/pexels-photo-1239291.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=160" alt="">
            <img src="https://images.pexels.com/photos/774909/pexels-photo-774909.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=160" alt="">
            <span>+2.000</span>
          </span>
        </span>
      </h1>
      <p class="lead">Med <b>avanceret teknologi</b> giver vi dig skånsomme behandlinger for et sundt og <b>selvsikkert smil.</b></p>
    </div>
  </div>

  <div class="figure">
    <div class="stat"><strong>98%</strong><small>loyale patienter</small></div>
    <img src="https://soft-zoom-63098134.figma.site/_assets/v11/ecccf0c10f5c64505f8cb104b04c72aba0b85b0c.png?w=512" alt="Glad patient, der jubler">
  </div>

  <div class="menu" id="menu">
    <button class="close" type="button" aria-label="Luk menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <nav aria-label="Menu">
      <a href="#om" style="--i:0">Om os</a>
      <a href="#resultater" style="--i:1">Resultater</a>
      <a href="#priser" style="--i:2">Priser</a>
      <a href="#anmeldelser" style="--i:3">Anmeldelser</a>
      <a href="#blog" style="--i:4">Blog</a>
    </nav>
    <a class="contact" href="#kontakt">Kontakt
      <span class="ring" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></span>
    </a>
  </div>
</section>

<script>
(function () {
  var hero = document.querySelector(".hero");
  var btn = document.querySelector(".burger");
  var menu = document.getElementById("menu");
  var close = menu.querySelector(".close");

  function setMenu(open) {
    hero.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", String(open));
  }
  btn.addEventListener("click", function () {
    setMenu(true);
    close.focus();
  });
  close.addEventListener("click", function () {
    setMenu(false);
    btn.focus();
  });
  menu.addEventListener("click", function (e) {
    if (e.target.closest("a") || e.target === menu) setMenu(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && hero.classList.contains("open")) {
      setMenu(false);
      btn.focus();
    }
  });
  // Luk menuen, hvis skærmen bliver bred nok til den normale navigation
  matchMedia("(min-width: 768px)").addEventListener("change", function (e) {
    if (e.matches) setMenu(false);
  });
})();
</script>
</body>
</html>
