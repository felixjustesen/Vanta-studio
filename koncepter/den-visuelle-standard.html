<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Den Visuelle Standard – Vanta Studio</title>
<meta name="robots" content="noindex">
<!--
  Arkiveret fra forsiden 2026-11-12 (tidligere sektionen #koncepter i index.html, sidst i commit 9bd905a).
  Kuglen med de ni koncepter og zoomen gennem V'et i "Den Visuelle Standard." – CSS, HTML og script
  er flyttet uændret hertil, så sektionen kan genbruges. Kun billedstierne er gjort absolutte.
  Siden linkes ikke fra resten af sitet. Konceptsiderne ligger stadig i /koncepter/01-… til 09-….
-->
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Fraunces";src:url("/assets/fonts/fraunces.woff2") format("woff2");font-weight:100 400;font-style:normal;font-display:block}
@font-face{font-family:"Inter";src:url("/assets/fonts/inter.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}

:root{
  --navy:#030318;
  --slate:#0F172A;
  --violet:#7c3aed;
  --cyan:#22d3ee;
  --lilac:#a78bfa;
  --mist:#ede9fe;
  --ease:cubic-bezier(.22,1,.36,1);
  --px:16px;
  --py:16px;
}
@media (min-width:640px){:root{--px:24px;--py:20px}}
@media (min-width:768px){:root{--px:40px;--py:32px}}
@media (min-width:1024px){:root{--px:56px}}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#000;color:#fff;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{margin:0;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
a,button{-webkit-tap-highlight-color:transparent}
img,svg,video{display:block}
:focus-visible{outline:1px solid #fff;outline-offset:4px}
.serif{font-family:"Fraunces","Times New Roman",serif;font-weight:100;font-variation-settings:"opsz" 144,"SOFT" 0,"WONK" 0;line-height:.85;letter-spacing:-.02em}

/* ---------- Koncepter: "Den Visuelle Standard." + big bang ---------- */
.univers{position:relative;height:420vh;background:#000}
.sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.nebula{display:none;position:absolute;inset:-20%;background:radial-gradient(closest-side,rgba(124,58,237,.38),rgba(124,58,237,.12) 45%,rgba(15,23,42,0) 75%);opacity:0;pointer-events:none}
.stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.q{position:absolute;inset:0;display:grid;place-items:center;padding:0 var(--px);pointer-events:none}
.q h2{margin:0;font-size:clamp(44px,8.4vw,136px);text-align:center;color:var(--mist);background:linear-gradient(180deg,var(--mist) 30%,var(--lilac));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;will-change:transform,opacity,filter}
.portal{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.space{position:absolute;inset:0;perspective:1400px;cursor:grab;touch-action:pan-y;pointer-events:none;-webkit-user-select:none;user-select:none}
.space.ready{pointer-events:auto}
.space.dragging{cursor:grabbing}
.sphere{position:absolute;inset:0;transform-style:preserve-3d}
.card{position:absolute;left:50%;top:50%;width:var(--cw,220px);height:calc(var(--cw,220px) * .625);margin:calc(var(--cw,220px) * -.3125) 0 0 calc(var(--cw,220px) / -2);border-radius:6px;overflow:hidden;background:var(--slate);box-shadow:0 0 0 1px rgba(167,139,250,.22),0 18px 40px -18px rgba(0,0,0,.8);opacity:0;-webkit-user-drag:none}
.card img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.card .tag{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:baseline;gap:8px;padding:18px 10px 8px;background:linear-gradient(rgba(15,23,42,0),rgba(15,23,42,.85));color:var(--mist);font-size:clamp(8px,.75vw,11px);letter-spacing:.14em;text-transform:uppercase;transition:opacity .3s}
.card .tag b{color:var(--cyan);font-weight:500}
.card > *{transition:opacity .35s}
.card.soon{display:grid;place-items:center;background:radial-gradient(120% 90% at 30% 20%,rgba(124,58,237,.55),rgba(15,23,42,.95) 70%),var(--slate)}
.card.soon .nr{font-family:"Fraunces",serif;font-weight:100;font-variation-settings:"opsz" 144;font-size:calc(var(--cw,220px) * .3);line-height:1;color:var(--mist);opacity:.9}
.card.live{padding:0;border:0;font:inherit;color:inherit;cursor:pointer;transition:box-shadow .3s}
.card.live:hover,.card.live:focus-visible,.card.open{box-shadow:0 0 0 1.5px var(--cyan),0 0 40px -6px rgba(34,211,238,.6);outline:none}
/* Det valgte koncept afspilles live i kortet: siden renderes i 1280×800 og skaleres ned */
.card .play{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.card .play iframe{position:absolute;left:0;top:0;width:1280px;height:800px;border:0;transform-origin:0 0;transform:scale(var(--fs,.17));opacity:0;transition:opacity .6s}
.card .play iframe.on{opacity:1}
.card .full{position:absolute;right:2.2%;bottom:3.5%;display:flex;align-items:center;gap:.5em;padding:.6em 1.1em;border-radius:999px;background:var(--cyan);color:#0b1220;font-size:clamp(10px,1.1vw,15px);font-weight:600;letter-spacing:.02em;box-shadow:0 8px 24px -8px rgba(0,0,0,.6);opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;pointer-events:none}
.card.open .full{opacity:1;transform:none;transition-delay:.5s}
.card.open:hover .full{background:#67e8f9}

.hud{position:absolute;inset:auto 0 0;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:0 var(--px) var(--py);color:var(--mist);opacity:0;pointer-events:none}
.hud.on{pointer-events:auto}
.hud-intro{display:grid;gap:14px;max-width:400px}
.hud-intro header{display:flex;align-items:center;gap:16px}
.hud-intro h3{margin:0;font-family:"Fraunces",serif;font-weight:200;font-variation-settings:"opsz" 72;font-size:28px;letter-spacing:-.01em}
.hud-intro p{margin:0;font-size:14px;line-height:1.6;color:rgba(237,233,254,.72)}
.hint{position:absolute;left:50%;bottom:var(--py);display:flex;align-items:center;gap:14px;transform:translateX(-50%);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(237,233,254,.6);white-space:nowrap}
.hint::before{content:"";width:40px;height:1px;background:linear-gradient(90deg,var(--cyan),var(--lilac))}
@media (max-width:767px){
  .hud{flex-direction:column;align-items:flex-start;gap:12px;padding-bottom:calc(var(--py) + 30px)}
  .hud-intro p{font-size:13px;line-height:1.5}
  .hud-intro h3{font-size:22px}
}

/* Rolig udgave: ingen eksplosion, kuglen står klar */
.univers.calm{height:auto}
.univers.calm .sticky{position:relative;height:100vh;height:100svh}
.univers.calm .q{place-items:start center;padding-top:10vh}
.univers.calm .q h2{font-size:clamp(32px,5vw,64px)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<section class="univers" id="koncepter" aria-labelledby="univers-titel">
  <div class="sticky">
    <div class="nebula" aria-hidden="true"></div>
    <canvas class="stars" aria-hidden="true"></canvas>
    <div class="q"><h2 class="serif" id="univers-titel">Den Visuelle Standard.</h2></div>
    <div class="space"><div class="sphere" role="group" aria-label="Koncepter"></div></div>
    <div class="hud">
      <div class="hud-intro">
        <header>
          <h3>Ni koncepter</h3>
        </header>
        <p>Sektionen er et preview af den visuelle standard, du kan forvente fra Vanta Studio. Hvert koncept er en levende skitse – fra tegnestue til tandklinik. Drej kuglen, og tryk på et koncept for at se det i bevægelse.</p>
      </div>
      <span class="hint" aria-hidden="true">Træk for at rotere</span>
    </div>
  </div>
</section>

<script>
(function () {
  // ---------- De ni koncepter – udfyld efterhånden som de bliver færdige ----------
  // "skift": en knap i konceptet, der trykkes på med jævne mellemrum, mens kortet er åbent (fx dag/nat)
  // "fuld": et nyt tryk på det åbne kort åbner hele siden i en ny fane
  var KONCEPTER = [
    { nr: "01", navn: "Arkitekt", kunde: "HALD & VANG", billede: "/billeder/koncepter/01-arkitekt.jpg", link: "/koncepter/01-arkitekt" },
    { nr: "02", navn: "Tandlæge", kunde: "Smilværket", billede: "/billeder/koncepter/02-tandlaege.jpg", link: "/koncepter/02-tandlaege" },
    { nr: "03", navn: "Frisør", kunde: "PARALLAX", billede: "/billeder/koncepter/03-parallax.jpg", link: "/koncepter/03-parallax" },
    { nr: "04", navn: "Ejendomsmægler", kunde: "HAVLINJE", billede: "/billeder/koncepter/04-havlinje.jpg", link: "/koncepter/04-havlinje" },
    { nr: "05", navn: "Solceller", kunde: "SOLHVERV", billede: "/billeder/koncepter/05-solhverv.jpg", link: "/koncepter/05-solhverv", skift: ".toggle-btn:not(.active)" },
    { nr: "06", navn: "Coaching", kunde: "KLARSYN", billede: "/billeder/koncepter/06-klarsyn.jpg", link: "/koncepter/06-klarsyn" },
    { nr: "07", navn: "Kosttilskud", kunde: "TERRAELIX", billede: "/billeder/koncepter/07-terraelix.jpg", link: "/koncepter/07-terraelix" },
    { nr: "08", navn: "Barber", kunde: "SKARP", billede: "/billeder/koncepter/08-skarp.jpg", link: "/koncepter/08-skarp", fuld: true },
    { nr: "09", navn: "Blomster", kunde: "KRONBLAD", billede: "/billeder/koncepter/09-kronblad.jpg", link: "/koncepter/09-kronblad" }
  ];

  var section = document.getElementById("koncepter");
  var sticky = section.querySelector(".sticky");
  var title = section.querySelector(".q h2");
  var nebula = section.querySelector(".nebula");
  var space = section.querySelector(".space");
  var sphere = section.querySelector(".sphere");
  var hud = section.querySelector(".hud");
  var canvas = section.querySelector(".stars");
  var ctx = canvas.getContext("2d");
  var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (calm) section.classList.add("calm");

  var clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };
  var range = function (v, a, b) { return clamp((v - a) / (b - a), 0, 1); };

  // ---------- Kort fordelt jævnt på en kugle (Fibonacci-gitter) ----------
  var GOLDEN = Math.PI * (3 - Math.sqrt(5));
  var cards = KONCEPTER.map(function (k, i) {
    var y = 1 - (i + 0.5) * 2 / KONCEPTER.length;
    var r = Math.sqrt(1 - y * y);
    var phi = i * GOLDEN;
    var lon = Math.atan2(Math.cos(phi) * r, Math.sin(phi) * r);
    var lat = Math.asin(y);

    var el;
    if (k.link) {
      el = document.createElement("button");
      el.type = "button";
      el.className = "live";
      el.setAttribute("aria-pressed", "false");
      el.setAttribute("aria-label", "Koncept " + k.nr + ": " + k.navn + " – " + k.kunde + ". Vis i bevægelse");
      el.innerHTML = '<img src="' + k.billede + '" alt="" draggable="false"><span class="tag"><b>' + k.nr + "</b>" + k.navn + "</span>" +
        (k.fuld ? '<span class="full" aria-hidden="true">Se hele siden <span>↗</span></span>' : "");
    } else {
      el = document.createElement("div");
      el.className = "soon";
      el.innerHTML = '<span class="nr">' + k.nr + '</span><span class="tag"><b>' + k.nr + "</b>Kommer snart</span>";
    }
    el.classList.add("card");
    sphere.appendChild(el);
    return {
      el: el,
      k: k,
      f: 0,     // 0 = på kuglen, 1 = forstørret og afspillet
      g: 1,
      play: null,
      lon: lon,
      lat: lat,
      // Kortets normal (retning ud fra kuglen) i CSS-koordinater
      n: [Math.cos(lat) * Math.sin(lon), -Math.sin(lat), Math.cos(lat) * Math.cos(lon)],
      back: false,
      flip: false
    };
  });

  // ---------- Stjernestøv fra big bang ----------
  var COLORS = ["34,211,238", "167,139,250", "237,233,254", "124,58,237"];
  var dust = [];
  for (var i = 0; i < 170; i++) {
    var u = Math.random() * 2 - 1;
    var t = Math.random() * Math.PI * 2;
    var s = Math.sqrt(1 - u * u);
    dust.push({
      d: [s * Math.cos(t), u, s * Math.sin(t)],
      k: 1.1 + Math.pow(Math.random(), 1.6) * 2.4,
      size: 0.5 + Math.random() * 1.7,
      c: COLORS[(Math.random() * COLORS.length) | 0],
      tw: Math.random() * Math.PI * 2
    });
  }

  // ---------- Mål ----------
  var W = 0, H = 0, R = 200, DPR = 1, PERSP = 1400, CW = 220;

  function measure() {
    W = sticky.clientWidth;
    H = sticky.clientHeight;
    var cw = W < 640 ? W * 0.4 : clamp(W * 0.19, 150, 300);
    CW = cw;
    R =W < 640 ? W * 0.42 : Math.min(W, H) * 0.3 + cw * 0.3;
    sphere.style.setProperty("--cw", cw.toFixed(1) + "px");
    sphere.style.setProperty("--fs", (cw / 1280).toFixed(4));
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    lastE = -1;
    layoutPortal();
  }

  // Rotation – samme rækkefølge som CSS "rotateX(pitch) rotateY(yaw)"
  var yaw = 0.4, pitch = -0.12, vyaw = 0, vpitch = 0;
  var AUTO = calm ? 0 : 0.00011; // radianer pr. ms
  function rotate(v) {
    var cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    var x = v[0] * cy + v[2] * sy;
    var z = -v[0] * sy + v[2] * cy;
    var y = v[1] * cp - z * sp;
    return [x, y, v[1] * sp + z * cp];
  }

  // ---------- Træk for at rotere ----------
  var dragging = false, moved = 0, lastX = 0, lastY = 0, lastT = 0;
  space.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;
    dragging = true;
    moved = 0;
    lastX = e.clientX;
    lastY = e.clientY;
    lastT = performance.now();
    vyaw = vpitch = 0;
    space.classList.add("dragging");
  });
  window.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var now = performance.now();
    var dx = e.clientX - lastX, dy = e.clientY - lastY, dt = Math.max(8, now - lastT);
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 6 && active) close();
    yaw += dx * 0.006;
    pitch = clamp(pitch - dy * 0.006, -1.1, 1.1);
    vyaw = clamp(dx * 0.006 / dt, -0.004, 0.004);
    vpitch = clamp(-dy * 0.006 / dt, -0.003, 0.003);
    lastX = e.clientX;
    lastY = e.clientY;
    lastT = now;
  });
  function release() {
    if (!dragging) return;
    dragging = false;
    space.classList.remove("dragging");
  }
  window.addEventListener("pointerup", release);
  window.addEventListener("pointercancel", release);
  // ---------- Tryk på et kort: det drejer frem, forstørres og afspiller konceptet ----------
  var active = null;
  function open(c) {
    if (active) close();
    active = c;
    c.el.classList.add("open");
    c.el.setAttribute("aria-pressed", "true");
    if (c.k.fuld) c.el.setAttribute("aria-label", "Se hele siden: " + c.k.kunde + " (åbner i en ny fane)");
    if (!c.play) {
      c.play = document.createElement("div");
      c.play.className = "play";
      var fr = document.createElement("iframe");
      fr.src = c.k.link;
      fr.title = c.k.kunde + " – designkoncept";
      fr.tabIndex = -1;
      fr.setAttribute("aria-hidden", "true");
      fr.setAttribute("scrolling", "no");
      fr.addEventListener("load", function () {
        // Lidt luft, så siden når at male sit første billede, før den toner frem
        setTimeout(function () { if (active === c) fr.classList.add("on"); }, 120);
        if (c.k.skift && active === c) {
          c.timer = setInterval(function () {
            try {
              var btn = fr.contentDocument.querySelector(c.k.skift);
              if (btn) btn.click();
            } catch (err) {}
          }, 3200);
        }
      });
      c.play.appendChild(fr);
      c.el.insertBefore(c.play, c.el.querySelector(".tag"));
    } else {
      c.play.firstChild.classList.add("on");
    }
  }
  function close() {
    var c = active;
    if (!c) return;
    active = null;
    c.el.classList.remove("open");
    c.el.setAttribute("aria-pressed", "false");
    if (c.k.fuld) c.el.setAttribute("aria-label", "Koncept " + c.k.nr + ": " + c.k.navn + " – " + c.k.kunde + ". Vis i bevægelse");
    clearInterval(c.timer);
    var play = c.play;
    if (!play) return;
    play.firstChild.classList.remove("on");
    // Siden fjernes helt, når den er tonet ud, så animationer og video stopper
    setTimeout(function () {
      if (c.play === play && active !== c) { play.remove(); c.play = null; }
    }, 600);
  }
  // Et træk må ikke åbne et koncept; et tryk ved siden af lukker det åbne
  space.addEventListener("click", function (e) {
    if (e.detail && moved > 6) return;
    var el = e.target.closest(".card.live");
    var c = el && cards.filter(function (x) { return x.el === el; })[0];
    if (!c) return close();
    if (active === c && c.k.fuld) window.open(c.k.link, "_blank", "noopener");
    else if (active === c) close(); else open(c);
  });
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && active) close();
  });
  sphere.addEventListener("dragstart", function (e) { e.preventDefault(); });

  // ---------- Portal: V'et for Vanta glider ind på midten, og kameraet zoomer gennem et vindue i det ----------
  // Mens man scroller, glider V'et i "Visuelle" ind på midten, og resten af overskriften toner ud
  // samtidig. Rummet mellem V'ets ben er et vindue ind til koncepterne: det toner ind, mens kameraet
  // begynder at zoome, og zoomen er færdig, når vinduet dækker hele skærmen.
  // Overskriften tegnes på et canvas, der zoomes på vektorniveau, så den forbliver skarp.
  var TEXT = title.textContent;
  var portal = document.createElement("canvas");
  portal.className = "portal";
  portal.setAttribute("aria-hidden", "true");
  sticky.insertBefore(portal, hud);
  var pctx = portal.getContext("2d");
  var hole = document.createElement("canvas");
  var PT = null, portalDone = false, fontReady = false;
  var smooth = function (t) { return t * t * t * (t * (t * 6 - 15) + 10); };
  function textFont(fs) { return "100 " + fs.toFixed(2) + 'px Fraunces, "Times New Roman", serif'; }

  function layoutPortal() {
    if (calm || !fontReady || !W) return;
    portal.width = Math.round(W * DPR);
    portal.height = Math.round(H * DPR);
    var fs = clamp(W * 0.084, 44, 136);
    var ls = (-0.02 * fs).toFixed(2) + "px";
    var pad = W < 640 ? 16 : W < 768 ? 24 : 40;
    pctx.setTransform(1, 0, 0, 1, 0, 0);
    pctx.font = textFont(fs);
    pctx.letterSpacing = ls;
    // Ombryd som overskriften
    var rows = [], cur = "";
    TEXT.split(" ").forEach(function (w) {
      var t = cur ? cur + " " + w : w;
      if (cur && pctx.measureText(t).width > W - pad * 2) { rows.push(cur); cur = w; } else cur = t;
    });
    rows.push(cur);
    var m = pctx.measureText(TEXT);
    var asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent, lh = fs * 0.95;
    var lines = rows.map(function (t, i) {
      return { t: t, x: (W - pctx.measureText(t).width) / 2, y: H / 2 + (i - (rows.length - 1) / 2) * lh + (asc - desc) / 2 };
    });
    // V'et tegnes for sig; resten af dets linje tegnes som teksten før og efter det
    var L = lines.filter(function (l) { return l.t.indexOf("V") >= 0; })[0];
    if (!L) { PT = null; portal.style.visibility = "hidden"; title.style.opacity = ""; return; }
    var vi = L.t.indexOf("V");
    var gx = L.x + pctx.measureText(L.t.slice(0, vi)).width, gy = L.y;
    var vm = pctx.measureText("V"), capH = vm.actualBoundingBoxAscent;

    // Vinduet: V'et tegnes stort med en vandret streg hen over toppen af benene, så rummet mellem
    // dem bliver en lukket trekant. Trekanten findes som den største lukkede baggrundsflade.
    var k = Math.max(4, 900 / fs), ox = fs * 0.2, oy = fs * 1.1;
    var mw = Math.ceil(fs * 1.2 * k), mh = Math.ceil(fs * 1.5 * k), n = mw * mh;
    hole.width = mw;
    hole.height = mh;
    var h = hole.getContext("2d", { willReadFrequently: true });
    h.setTransform(k, 0, 0, k, 0, 0);
    h.font = textFont(fs);
    h.letterSpacing = ls;
    h.fillText("V", ox, oy);
    h.fillRect(ox - vm.actualBoundingBoxLeft, oy - capH, vm.actualBoundingBoxLeft + vm.actualBoundingBoxRight, Math.max(1.5, fs * 0.012));
    var px = h.getImageData(0, 0, mw, mh).data;
    var lab = new Int32Array(n), queue = new Int32Array(n);
    for (var i = 0; i < n; i++) if (px[i * 4 + 3] >= 128) lab[i] = -1;
    function fill(start, id) {
      var head = 0, tail = 0, cnt = 0, sx = 0, sy = 0;
      lab[start] = id;
      queue[tail++] = start;
      while (head < tail) {
        var q = queue[head++], x = q % mw, y = (q - x) / mw;
        cnt++; sx += x; sy += y;
        if (x > 0 && !lab[q - 1]) { lab[q - 1] = id; queue[tail++] = q - 1; }
        if (x < mw - 1 && !lab[q + 1]) { lab[q + 1] = id; queue[tail++] = q + 1; }
        if (y > 0 && !lab[q - mw]) { lab[q - mw] = id; queue[tail++] = q - mw; }
        if (y < mh - 1 && !lab[q + mw]) { lab[q + mw] = id; queue[tail++] = q + mw; }
      }
      return { cnt: cnt, x: sx / cnt, y: sy / cnt };
    }
    for (var x = 0; x < mw; x++) { if (!lab[x]) fill(x, -1); if (!lab[n - mw + x]) fill(n - mw + x, -1); }
    for (var y = 0; y < mh; y++) { if (!lab[y * mw]) fill(y * mw, -1); if (!lab[y * mw + mw - 1]) fill(y * mw + mw - 1, -1); }
    var best = 0, bestInfo = null, id = 0;
    for (i = 0; i < n; i++) {
      if (lab[i]) continue;
      var info = fill(i, ++id);
      if (!bestInfo || info.cnt > bestInfo.cnt) { best = id; bestInfo = info; }
    }
    if (!bestInfo) { PT = null; portal.style.visibility = "hidden"; title.style.opacity = ""; return; }

    // Vinduet gøres 3 px større ind under stregen, så kanten skjules af bogstavet
    var grow = new Uint8Array(n);
    for (i = 0; i < n; i++) if (lab[i] === best) grow[i] = 1;
    for (var pass = 0; pass < 3; pass++) {
      var next = grow.slice();
      for (i = 0; i < n; i++) {
        if (grow[i]) continue;
        var xx = i % mw;
        if ((xx > 0 && grow[i - 1]) || (xx < mw - 1 && grow[i + 1]) || (i >= mw && grow[i - mw]) || (i < n - mw && grow[i + mw])) next[i] = 1;
      }
      grow = next;
    }
    var img = h.createImageData(mw, mh);
    for (i = 0; i < n; i++) if (grow[i]) img.data[i * 4 + 3] = 255;
    h.putImageData(img, 0, 0);

    // Zoomen sigter mod vinduets midte og er færdig, når vinduet dækker hele skærmen
    var F = { x: gx - ox + bestInfo.x / k, y: gy - oy + bestInfo.y / k };
    function covered(z) {
      for (var a = 0; a <= 8; a++) for (var b = 0; b <= 8; b++) {
        if (a > 0 && a < 8 && b > 0 && b < 8) continue;
        var u = Math.round((F.x + (W * a / 8 - W / 2) / z - gx + ox) * k);
        var v = Math.round((F.y + (H * b / 8 - H / 2) / z - gy + oy) * k);
        if (u < 0 || v < 0 || u >= mw || v >= mh || lab[v * mw + u] !== best) return false;
      }
      return true;
    }
    var lo = 1, hi = 20000;
    for (i = 0; i < 40; i++) { var mid = Math.sqrt(lo * hi); if (covered(mid)) hi = mid; else lo = mid; }

    var grad = pctx.createLinearGradient(0, lines[0].y - asc, 0, lines[lines.length - 1].y + desc);
    grad.addColorStop(0.3, "#ede9fe");
    grad.addColorStop(1, "#a78bfa");
    PT = {
      fs: fs, ls: ls, lines: lines, L: L, pre: L.t.slice(0, vi), post: L.t.slice(vi + 1),
      postX: L.x + pctx.measureText(L.t.slice(0, vi + 1)).width, gx: gx, gy: gy,
      Vc: { x: gx + vm.width / 2, y: gy - capH / 2 }, F: F, ox: ox, oy: oy, k: k, mw: mw, mh: mh, zFull: hi, grad: grad
    };
    portalDone = false;
    portal.style.visibility = "";
    title.style.opacity = "0";
    drawPortal(progress());
  }

  // Tegner forhænget for scrollposition p og returnerer, hvor universets midte skal ligge.
  // 0,03–0,20: V'et glider ind på midten, og resten toner ud samtidig. 0,14–0,32: vinduet toner ind.
  // 0,20–0,56: kameraet zoomer gennem vinduet, til det dækker skærmen.
  function drawPortal(p) {
    if (!PT) return [0, 0];
    var a = smooth(range(p, 0.03, 0.2));
    var s = smooth(range(p, 0.2, 0.56));
    var z = (1 + 0.35 * a) * Math.pow(PT.zFull * 1.15 / 1.35, s);
    // Kameraet følger V'ets midte ind på skærmens midte og glider så over på vinduets midte
    var kk = smooth(range(s, 0, 0.5));
    var tx = PT.Vc.x + (PT.F.x - PT.Vc.x) * kk, ty = PT.Vc.y + (PT.F.y - PT.Vc.y) * kk;
    var sx = PT.Vc.x + (W / 2 - PT.Vc.x) * a, sy = PT.Vc.y + (H / 2 - PT.Vc.y) * a;
    var done = z >= PT.zFull;
    if (done !== portalDone) {
      portalDone = done;
      portal.style.visibility = done ? "hidden" : "";
    }
    if (!done) {
      pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      pctx.globalCompositeOperation = "source-over";
      pctx.globalAlpha = 1;
      pctx.fillStyle = "#000";
      pctx.fillRect(0, 0, W, H);
      var sc = DPR * z;
      pctx.setTransform(sc, 0, 0, sc, DPR * (sx - tx * z), DPR * (sy - ty * z));
      var win = smooth(range(p, 0.14, 0.32));
      if (win > 0) {
        pctx.globalCompositeOperation = "destination-out";
        pctx.globalAlpha = win;
        pctx.drawImage(hole, PT.gx - PT.ox, PT.gy - PT.oy, PT.mw / PT.k, PT.mh / PT.k);
        pctx.globalCompositeOperation = "source-over";
      }
      pctx.font = textFont(PT.fs);
      pctx.letterSpacing = PT.ls;
      pctx.fillStyle = PT.grad;
      if (a < 0.998) {
        pctx.globalAlpha = 1 - a;
        PT.lines.forEach(function (L) {
          if (L !== PT.L) { pctx.fillText(L.t, L.x, L.y); return; }
          if (PT.pre) pctx.fillText(PT.pre, L.x, L.y);
          if (PT.post) pctx.fillText(PT.post, PT.postX, L.y);
        });
      }
      pctx.globalAlpha = 1;
      pctx.fillText("V", PT.gx, PT.gy);
    }
    return [sx + (PT.F.x - tx) * z - W / 2, sy + (PT.F.y - ty) * z - H / 2];
  }
  if (!calm) {
    title.style.opacity = "0";
    document.fonts.load(textFont(100)).then(function () { fontReady = true; layoutPortal(); });
  }

  // ---------- Hovedløkke ----------
  var lastE = -1, prev = performance.now(), running = false;

  // 320vh scroll: zoom gennem overskriften og ind i kuglen
  function progress() {
    if (calm) return 1;
    var rect = section.getBoundingClientRect();
    return clamp(-rect.top / (rect.height - H), 0, 1);
  }
  function wrapAngle(a) {
    var t = Math.PI * 2;
    return ((a % t) + t * 1.5) % t - Math.PI;
  }

  function frame(now) {
    if (!running) return;
    var dt = Math.min(64, now - prev);
    prev = now;
    var p = progress();

    // 1) Kameraet zoomer gennem vinduet i V'et; universet ligger bag det
    var off = calm ? [0, 0] : drawPortal(p);
    space.style.translate = off[0].toFixed(1) + "px " + off[1].toFixed(1) + "px";
    // 2) Kortene ses samlet langt inde og glider ud i kuglen, mens vi passerer bogstavet
    var vis = calm ? 1 : range(p, 0.02, 0.12);
    var e = calm ? 1 : smooth(range(p, 0.1, 0.6));
    var ui = calm ? 1 : range(p, 0.62, 0.72);
    hud.style.opacity = ui.toFixed(3);
    hud.classList.toggle("on", ui > 0.6);
    space.classList.toggle("ready", e > 0.97);

    // 3) Kortene flyver ud og lægger sig på kuglen
    var sc0 = 0.35 + 0.65 * e;
    // Det åbne kort rykker frem og vokser til en fast skærmbredde
    var ease = Math.min(1, dt * 0.008);
    var base = CW * PERSP / (PERSP - R);
    var big = Math.min(W * 0.88, H * 0.72 / 0.625, base * 1.65);
    var F = 0;
    cards.forEach(function (c) {
      c.f += ((c === active ? 1 : 0) - c.f) * ease;
      if (c.f < 0.001) c.f = 0;
      F = Math.max(F, c.f);
      // Det åbne kort lægges ud i sin store størrelse og skaleres ned, så siden tegnes skarpt
      var g = c === active || c.f > 0 ? big / CW : 1;
      if (g !== c.g) {
        c.g = g;
        if (g === 1) {
          c.el.style.removeProperty("--cw");
          c.el.style.removeProperty("--fs");
        } else {
          c.el.style.setProperty("--cw", (CW * g).toFixed(1) + "px");
          c.el.style.setProperty("--fs", (CW * g / 1280).toFixed(4));
        }
      }
      var f = c.f * c.f * (3 - 2 * c.f);
      var lift = R * 0.4 * f;
      var grow = (base + (big - base) * f) / (CW * PERSP / (PERSP - R - lift));
      c.el.style.transform = "rotateY(" + c.lon.toFixed(4) + "rad) rotateX(" + c.lat.toFixed(4) + "rad) translateZ(" + (R * e + lift).toFixed(1) + "px) scale(" + (sc0 * grow / g).toFixed(4) + ")" + (c.flip ? " rotateY(180deg)" : "");
    });

    if (active && !dragging) {
      // Kuglen drejer det valgte kort lige ind foran beskueren
      var turn = Math.min(1, dt * 0.006);
      yaw += wrapAngle(-active.lon - yaw) * turn;
      pitch += (-active.lat - pitch) * turn;
      vyaw = vpitch = 0;
    } else if (!dragging) {
      vyaw += (AUTO - vyaw) * Math.min(1, dt * 0.002);
      vpitch *= Math.pow(0.996, dt);
      yaw += vyaw * dt;
      pitch = clamp(pitch + vpitch * dt, -1.1, 1.1);
      pitch += (-0.12 - pitch) * Math.min(1, dt * 0.0006);
    }
    var spin = calm ? 0 : (1 - e) * 1.4; // roligt drej, mens kortene folder sig ud
    sphere.style.transform = "translateZ(" + (-(1 - e) * 900).toFixed(1) + "px) rotateX(" + pitch.toFixed(4) + "rad) rotateY(" + (yaw + spin).toFixed(4) + "rad)";

    // Kort på bagsiden dæmpes
    var yawSave = yaw;
    yaw += spin;
    cards.forEach(function (c) {
      var z = rotate(c.n)[2];
      var depth = (z + 1) / 2;
      var op0 = vis * (0.45 + 0.55 * Math.pow(depth, 1.3));
      var br0 = 0.5 + 0.5 * depth;
      // Kort på bagsiden vendes, så forsiden stadig ses (vendingen sker, mens kortet står på højkant)
      c.flip = z < 0;
      // De andre kort træder i baggrunden, mens et koncept spiller
      op0 = op0 + (1 - op0) * c.f - op0 * 0.55 * (F - c.f);
      br0 = br0 + (1 - br0) * c.f;
      c.el.style.opacity = op0.toFixed(3);
      c.el.style.filter = c.f > 0.999 ? "none" : "brightness(" + br0.toFixed(3) + ")";
      var back = z < -0.05;
      if (back !== c.back) {
        c.back = back;
        c.el.classList.toggle("back", back);
        if (c.k.link) c.el.tabIndex = back ? -1 : 0;
      }
    });

    // Stjernestøvet
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (vis > 0.001) {
      ctx.globalCompositeOperation = "lighter";
      var cx = W / 2 + off[0], cy = H / 2 + off[1];
      for (var i = 0; i < dust.length; i++) {
        var d = dust[i];
        var dist = R * d.k;
        var v = rotate([d.d[0] * dist, d.d[1] * dist, d.d[2] * dist]);
        var sc = PERSP / (PERSP - v[2]);
        if (sc <= 0) continue;
        var depthD = clamp((v[2] / (R * d.k) + 1) / 2, 0, 1);
        var twinkle = 0.75 + 0.25 * Math.sin(now * 0.002 + d.tw);
        var alpha = (0.2 + 0.8 * depthD) * twinkle * vis;
        ctx.fillStyle = "rgba(" + d.c + "," + alpha.toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(cx + v[0] * sc, cy + v[1] * sc, d.size * sc, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
    }
    yaw = yawSave;

    requestAnimationFrame(frame);
  }

  // Kør kun løkken, mens sektionen er synlig
  new IntersectionObserver(function (entries) {
    var visible = entries[0].isIntersecting;
    if (visible && !running) {
      running = true;
      prev = performance.now();
      requestAnimationFrame(frame);
    } else if (!visible) {
      running = false;
      close();
    }
  }).observe(section);

  measure();
  window.addEventListener("resize", measure);
})();
</script>
</body>
</html>
