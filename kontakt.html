<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start et projekt – Vanta Studio</title>
<meta name="description" content="Fortæl os kort om din virksomhed, så vender vi tilbage inden for 24 timer.">
<link rel="canonical" href="https://www.vantastudio.dk/kontakt">
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23030318'/%3E%3Cpath d='M8 9h3.4l4.6 11.2L20.6 9H24l-6.6 15h-2.8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Inter";src:url("assets/fonts/inter.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}

:root{
  --slate:#0F172A;
  --violet:#7c3aed;
  --cyan:#22d3ee;
  --lilac:#a78bfa;
  --mist:#ede9fe;
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100svh;background:var(--slate);color:#fff;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

.scene{position:fixed;inset:0;width:100%;height:100%;display:block}

.back{position:fixed;top:20px;left:20px;z-index:3;display:inline-flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:999px;background:rgba(15,23,42,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:background-color .3s}
.back:hover{background:rgba(15,23,42,.55)}

.wrap{position:relative;z-index:2;display:grid;place-items:center;min-height:100vh;min-height:100svh;padding:84px 16px 40px}

/* Glaskort */
.card{position:relative;width:min(440px,100%);padding:44px clamp(24px,5vw,44px) 36px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);box-shadow:0 30px 80px -30px rgba(10,6,40,.8);animation:rise 1.1s var(--ease) .2s both}
.card::before{content:"";position:absolute;inset:0;padding:1px;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.06) 40%,rgba(255,255,255,.04) 70%,rgba(255,255,255,.22));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}

.mark{display:block;width:44px;height:44px;margin:0 auto 22px}
h1{margin:0;font-size:clamp(32px,4.4vw,42px);font-weight:600;line-height:1.05;letter-spacing:-.035em;text-align:center}
.sub{margin:10px 0 30px;font-size:14px;text-align:center;color:rgba(237,233,254,.75)}

form{display:grid;gap:14px}
label{display:grid;gap:7px;font-size:13px;color:rgba(237,233,254,.85)}
input,textarea{width:100%;padding:13px 16px;border:0;border-radius:14px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);font-size:15px;color:#fff;transition:box-shadow .3s,background-color .3s}
textarea{min-height:92px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:rgba(237,233,254,.4)}
input:focus,textarea:focus{outline:none;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(34,211,238,.7),0 0 0 4px rgba(34,211,238,.12)}
.send{margin-top:8px;padding:15px;border:0;border-radius:999px;background:#fff;color:var(--slate);font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 10px 30px -10px rgba(167,139,250,.8);transition:transform .3s var(--ease),box-shadow .3s}
.send:hover{transform:translateY(-1px);box-shadow:0 14px 34px -10px rgba(167,139,250,1)}
.alt{margin:22px 0 0;font-size:13px;text-align:center;color:rgba(237,233,254,.6)}
.alt a{color:#fff;font-weight:500}
.alt a:hover{text-decoration:underline}

.done{display:none;text-align:center}
.done p{margin:12px 0 0;color:rgba(237,233,254,.75);font-size:15px}
.card.sent form,.card.sent .sub,.card.sent .alt,.card.sent h1.ask{display:none}
.card.sent .done{display:block;animation:rise .8s var(--ease) both}

@media (prefers-reduced-motion:reduce){.card,.card.sent .done{animation:none}}
</style>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
<canvas class="scene" aria-hidden="true"></canvas>

<a class="back" href="index.html">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  Vanta Studio
</a>

<main class="wrap">
  <section class="card" aria-labelledby="titel">
    <svg class="mark" viewBox="0 0 44 44" aria-hidden="true">
      <defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ede9fe"/></linearGradient></defs>
      <path d="M6 8h9.5l6.5 17.5L28.5 8H38L26.5 36h-9z" fill="url(#mk)"/>
    </svg>
    <h1 class="ask" id="titel">Start et projekt</h1>
    <p class="sub">Vi svarer inden for 24 timer.</p>

    <form novalidate>
      <label>Navn
        <input name="navn" type="text" autocomplete="name" required>
      </label>
      <label>E-mail
        <input name="email" type="email" autocomplete="email" required>
      </label>
      <label>Hvad drømmer I om?
        <textarea name="besked" rows="3" placeholder="Fx ny hjemmeside, AI-chat eller flere genbookinger"></textarea>
      </label>
      <button class="send" type="submit">Send</button>
    </form>

    <p class="alt">Eller skriv til <a href="mailto:hej@vantastudio.dk">hej@vantastudio.dk</a></p>

    <div class="done" role="status" aria-live="polite">
      <h1>Tak!</h1>
      <p>Vi vender tilbage inden for 24 timer.</p>
    </div>
  </section>
</main>

<script>
(function () {
  // ---------- Formular ----------
  // Der er ingen server endnu, så beskeden åbnes som en færdig mail
  var card = document.querySelector(".card");
  var form = card.querySelector("form");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = form.elements;
    var bad = [f.navn, f.email].filter(function (el) { return !el.checkValidity(); });
    if (bad.length) {
      bad[0].focus();
      bad[0].reportValidity();
      return;
    }
    var body = f.besked.value + "\n\n" + f.navn.value + "\n" + f.email.value;
    window.location.href = "mailto:hej@vantastudio.dk?subject=" + encodeURIComponent("Nyt projekt – " + f.navn.value) + "&body=" + encodeURIComponent(body);
    card.classList.add("sent");
  });

  // ---------- Lavendelmark under stjernehimlen ----------
  var canvas = document.querySelector(".scene");
  var ctx = canvas.getContext("2d");
  var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W, H, DPR, horizon, sky, flowers, stars, rows;
  var ROWS = 15;

  function rand(n) {
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  // Perspektiv: verdenskoordinat (x, z) -> skærm
  function project(wx, z) {
    var s = 1 / z;
    return [W / 2 + wx * W * 0.62 * s, horizon + (H - horizon) * 1.05 * s, s];
  }

  function hillPath(c, base, amp, seed, color) {
    c.beginPath();
    c.moveTo(0, H);
    for (var x = 0; x <= W; x += 8) {
      var u = x / W;
      var y = base - amp * (0.55 * Math.sin(u * 3.1 + seed) + 0.3 * Math.sin(u * 7.3 + seed * 2) + 0.15 * Math.sin(u * 13 + seed * 3) + 0.5);
      c.lineTo(x, y);
    }
    c.lineTo(W, H);
    c.closePath();
    c.fillStyle = color;
    c.fill();
  }

  function build() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    horizon = H * 0.5;

    // Himmel, bakker og markens mørke rækker tegnes én gang
    sky = document.createElement("canvas");
    sky.width = canvas.width;
    sky.height = canvas.height;
    var c = sky.getContext("2d");
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    var g = c.createLinearGradient(0, 0, 0, horizon);
    g.addColorStop(0, "#0b1024");
    g.addColorStop(0.45, "#1e1b4b");
    g.addColorStop(0.78, "#4c2f8f");
    g.addColorStop(1, "#9b7ee8");
    c.fillStyle = g;
    c.fillRect(0, 0, W, horizon + 2);
    // Slør af lyserødt lys bag bakkerne
    var glow = c.createRadialGradient(W * 0.55, horizon, 0, W * 0.55, horizon, W * 0.6);
    glow.addColorStop(0, "rgba(237,233,254,.35)");
    glow.addColorStop(1, "rgba(237,233,254,0)");
    c.fillStyle = glow;
    c.fillRect(0, 0, W, horizon);

    hillPath(c, horizon - H * 0.02, H * 0.12, 1.3, "#3b2f74");
    hillPath(c, horizon + H * 0.005, H * 0.07, 4.1, "#2a2358");

    // Jorden
    var fg = c.createLinearGradient(0, horizon, 0, H);
    fg.addColorStop(0, "#241d4f");
    fg.addColorStop(1, "#140f2e");
    c.fillStyle = fg;
    c.fillRect(0, horizon, W, H - horizon);

    // Lys sti midt igennem
    var p1 = project(-0.04, 30), p2 = project(0.04, 30), p3 = project(0.32, 1), p4 = project(-0.32, 1);
    var pg = c.createLinearGradient(0, horizon, 0, H);
    pg.addColorStop(0, "rgba(167,139,250,.12)");
    pg.addColorStop(1, "rgba(200,190,235,.2)");
    c.beginPath();
    c.moveTo(p1[0], p1[1]); c.lineTo(p2[0], p2[1]); c.lineTo(p3[0], H); c.lineTo(p4[0], H); c.closePath();
    c.fillStyle = pg;
    c.fill();

    // Rækkernes mørke bund
    rows = [];
    for (var r = 0; r < ROWS; r++) {
      var side = r < ROWS / 2 ? -1 : 1;
      var k = side < 0 ? r : ROWS - 1 - r;
      var wx = side * (0.62 + k * 0.5);
      rows.push(wx);
      var a = project(wx - 0.22, 40), b = project(wx + 0.22, 40), d = project(wx + 0.22, 0.9), e = project(wx - 0.22, 0.9);
      c.beginPath();
      c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.lineTo(d[0], d[1] + 40); c.lineTo(e[0], e[1] + 40); c.closePath();
      c.fillStyle = "#2b2160";
      c.fill();
    }

    // Blomster: mange små klynger langs rækkerne, bagerst først
    flowers = [];
    var COLORS = ["124,58,237", "167,139,250", "196,181,253", "237,233,254", "139,92,246", "34,211,238"];
    var count = Math.round(Math.min(6500, W * H / 170));
    for (var i = 0; i < count; i++) {
      var row = rows[Math.floor(rand(i * 3.1) * ROWS)];
      var z = 0.9 + Math.pow(rand(i * 7.7), 1.8) * 34;
      var wxF = row + (rand(i * 1.3) - 0.5) * 0.46;
      var pc = rand(i * 5.9);
      flowers.push({
        wx: wxF,
        z: z,
        h: 0.07 + rand(i * 2.2) * 0.1,
        r: 0.008 + rand(i * 4.4) * 0.006,
        c: COLORS[pc < 0.03 ? 5 : Math.floor(pc * 5)],
        a: 0.55 + rand(i * 8.8) * 0.45,
        ph: rand(i * 9.9) * 6.28
      });
    }
    flowers.sort(function (p, q) { return q.z - p.z; });

    stars = [];
    for (var s = 0; s < 220; s++) {
      stars.push([rand(s * 11.1) * W, Math.pow(rand(s * 13.7), 1.6) * horizon * 0.85, 0.3 + rand(s * 17.3) * 1.1, rand(s * 19.9) * 6.28]);
    }
  }

  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.drawImage(sky, 0, 0, W, H);

    // Stjerner, der blinker svagt
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 1.3 + st[3]));
      ctx.fillStyle = "#ede9fe";
      ctx.fillRect(st[0], st[1], st[2], st[2]);
    }

    // Vinden: en langsom bølge, der ruller gennem marken
    for (var j = 0; j < flowers.length; j++) {
      var f = flowers[j];
      var p = project(f.wx, f.z);
      if (p[0] < -40 || p[0] > W + 40) continue;
      var scale = p[2] * W * 0.62;
      var stem = f.h * scale;
      var sway = calm ? 0 : Math.sin(t * 1.1 - f.z * 0.35 + f.wx * 0.6 + f.ph * 0.3) * stem * 0.28;
      var x = p[0] + sway, y = p[1] - stem;
      var rad = Math.max(0.5, f.r * scale);
      var alpha = f.a * Math.min(1, 0.3 + p[2] * 3);
      // Stilk
      if (rad > 1.2) {
        ctx.globalAlpha = alpha * 0.55;
        ctx.strokeStyle = "#2e2a5c";
        ctx.lineWidth = Math.max(0.6, rad * 0.35);
        ctx.beginPath();
        ctx.moveTo(p[0], p[1]);
        ctx.quadraticCurveTo(p[0] + sway * 0.3, p[1] - stem * 0.5, x, y + stem * 0.15);
        ctx.stroke();
      }
      // Akset: små blomster stablet op ad stilken
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "rgb(" + f.c + ")";
      var dots = rad > 1.6 ? 6 : 3;
      for (var k = 0; k < dots; k++) {
        var q = k / dots;
        var dx = x - sway * q * 0.35 + (k % 2 ? rad * 0.5 : -rad * 0.5);
        var dy = y + stem * 0.32 - q * stem * 0.5;
        var rr = rad * (1 - q * 0.45);
        if (rr < 1.4) ctx.fillRect(dx - rr, dy - rr, rr * 2, rr * 2);
        else {
          ctx.beginPath();
          ctx.arc(dx, dy, rr, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;

    // Dis ved horisonten og mørk kant
    var haze = ctx.createLinearGradient(0, horizon - H * 0.06, 0, horizon + H * 0.12);
    haze.addColorStop(0, "rgba(155,126,232,0)");
    haze.addColorStop(0.5, "rgba(155,126,232,.28)");
    haze.addColorStop(1, "rgba(155,126,232,0)");
    ctx.fillStyle = haze;
    ctx.fillRect(0, horizon - H * 0.06, W, H * 0.18);
    var vig = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.35, W / 2, H * 0.55, Math.max(W, H) * 0.85);
    vig.addColorStop(0, "rgba(10,8,30,0)");
    vig.addColorStop(1, "rgba(10,8,30,.55)");
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  var last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (now - last < 33 || document.hidden) return;
    last = now;
    draw(now / 1000);
  }

  build();
  draw(0);
  if (!calm) requestAnimationFrame(frame);
  window.addEventListener("resize", function () { build(); draw(performance.now() / 1000); });
})();
</script>
</body>
</html>
